<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='630' viewBox='0 0 1200 630'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#fbfbfd'/>
      <stop offset='100%' stop-color='#f0f4ff'/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width='1200' height='630' fill='url(#bg)'/>
  <!-- left accent bar -->
  <rect x='80' y='200' width='5' height='180' rx='3' fill='#0071e3' opacity='0.25'/>
  <!-- eyebrow -->
  <text x='108' y='238' font-family='-apple-system,BlinkMacSystemFont,Helvetica Neue,sans-serif' font-size='18' font-weight='600' fill='#0071e3' letter-spacing='2'>AI · PRODUCT · OPERATIONS</text>
  <!-- main title -->
  <text x='108' y='310' font-family='-apple-system,BlinkMacSystemFont,Helvetica Neue,sans-serif' font-size='58' font-weight='700' fill='#1d1d1f' letter-spacing='-1.5'>Sergei Kolesnikov</text>
  <!-- subtitle line 1 -->
  <text x='108' y='372' font-family='-apple-system,BlinkMacSystemFont,Helvetica Neue,sans-serif' font-size='26' font-weight='400' fill='#494950'>AI that reaches production —</text>
  <!-- subtitle line 2 -->
  <text x='108' y='408' font-family='-apple-system,BlinkMacSystemFont,Helvetica Neue,sans-serif' font-size='26' font-weight='400' fill='#494950'>not just a pilot.</text>
  <!-- bottom tag -->
  <rect x='108' y='460' width='220' height='44' rx='22' fill='#0071e3'/>
  <text x='218' y='487' font-family='-apple-system,BlinkMacSystemFont,Helvetica Neue,sans-serif' font-size='16' font-weight='500' fill='white' text-anchor='middle'>Get in touch</text>
  <!-- decorative circle -->
  <circle cx='980' cy='315' r='220' fill='#0071e3' opacity='0.04'/>
  <circle cx='980' cy='315' r='150' fill='#0071e3' opacity='0.05'/>
  <circle cx='980' cy='315' r='80' fill='#0071e3' opacity='0.07'/>
</svg>